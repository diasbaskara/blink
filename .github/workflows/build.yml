name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: use cache
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          xcfs/.build
          Frameworks/ios_system/xcfs/.build
        key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift') }}

    - name: get frameworks
      if: steps.cache.outputs.cache-hit != 'true'
      run: ./get_frameworks.sh

    - name: get resources
      if: steps.cache.outputs.cache-hit != 'true'
      run: ./get_resources.sh

    - name: copy xcconfig
      run: cp template_setup.xcconfig developer_setup.xcconfig

    - name: strip unsupported entitlements
      run: |
        # xtool only provisions: application-identifier, team-identifier, keychain-access-groups,
        # get-task-allow, aps-environment, application-groups.
        # Strip everything else from ALL entitlement files to prevent provisioning profile mismatches.
        for ENT_FILE in Blink/Blink.entitlements BlinkFileProviderExtension/BlinkFileProviderExtension.entitlements; do
          [ -f "$ENT_FILE" ] || continue
          cp "$ENT_FILE" "$ENT_FILE.bak"
          for key in \
            com.apple.developer.associated-domains \
            com.apple.developer.default-data-protection \
            com.apple.developer.icloud-container-identifiers \
            com.apple.developer.icloud-services \
            com.apple.developer.ubiquity-container-identifiers \
            com.apple.developer.ubiquity-kvstore-identifier \
            com.apple.developer.user-fonts \
            com.apple.developer.web-browser \
            com.apple.security.app-sandbox \
            com.apple.security.device.bluetooth \
            com.apple.security.device.camera \
            com.apple.security.files.user-selected.read-write \
            com.apple.security.network.client \
            com.apple.security.network.server \
            com.apple.security.personal-information.location; do
            /usr/libexec/PlistBuddy -c "Delete :$key" "$ENT_FILE" 2>/dev/null || true
          done
          echo "Stripped $ENT_FILE:" && /usr/libexec/PlistBuddy -c "Print" "$ENT_FILE"
        done
    - name: build unsigned app
      run: |
        set -o pipefail
        xcodebuild \
          -project Blink.xcodeproj \
          -scheme Blink \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath ./DerivedData \
          CODE_SIGN_IDENTITY='' \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          build 2>&1 | tee build.log

    - name: generate unsigned ipa
      run: |
        APP_PATH=$(find ./DerivedData -name "Blink.app" -type d | head -1)
        echo "Found app at: $APP_PATH"
        # Remove app extensions - xtool signer doesn't properly handle per-extension entitlements
        # which causes provisioning mismatch crashes. Core Blink (SSH terminal) works without them.
        if [ -d "$APP_PATH/PlugIns" ]; then
          echo "Removing app extensions: $(ls "$APP_PATH/PlugIns")"
          rm -rf "$APP_PATH/PlugIns"
        fi
        # Also remove any debug/preview dylibs that may cause issues
        find "$APP_PATH" -name "*.debug.dylib" -delete 2>/dev/null || true
        find "$APP_PATH" -name "__preview.dylib" -delete 2>/dev/null || true
        mkdir Payload
        cp -r "$APP_PATH" Payload/
        zip -r Blink.ipa Payload

    - name: extract version
      id: version
      run: |
        APP_PATH=$(find ./DerivedData -name "Blink.app" -type d | head -1)
        VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist")
        BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP_PATH/Info.plist")
        echo "tag=v${VER}-${BUILD}" >> $GITHUB_OUTPUT

    - name: publish release
      uses: softprops/action-gh-release@v2
      with:
        name: Blink ${{ steps.version.outputs.tag }}
        tag_name: ${{ steps.version.outputs.tag }}
        files: Blink.ipa
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}