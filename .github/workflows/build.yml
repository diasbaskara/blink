name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: use cache
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          xcfs/.build
          Frameworks/ios_system/xcfs/.build
        key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift') }}

    - name: get frameworks
      if: steps.cache.outputs.cache-hit != 'true'
      run: ./get_frameworks.sh

    - name: get resources
      if: steps.cache.outputs.cache-hit != 'true'
      run: ./get_resources.sh

    - name: copy xcconfig
      run: cp template_setup.xcconfig developer_setup.xcconfig

    - name: build unsigned app
      run: |
        set -o pipefail
        xcodebuild \
          -project Blink.xcodeproj \
          -scheme Blink \
          -sdk iphoneos \
          -configuration Debug \
          -derivedDataPath ./DerivedData \
          CODE_SIGN_IDENTITY='' \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          build 2>&1 | tee build.log

    - name: generate unsigned ipa
      run: |
        APP_PATH=$(find ./DerivedData -name "Blink.app" -type d | head -1)
        echo "Found app at: $APP_PATH"
        mkdir Payload
        cp -r "$APP_PATH" Payload/
        zip -r Blink.ipa Payload

    - name: upload ipa
      uses: actions/upload-artifact@v4
      with:
        name: Blink.ipa
        path: Blink.ipa