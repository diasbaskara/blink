name: Build IPA

on:
  push:
  workflow_dispatch:


jobs:
  build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: use cache
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          xcfs/.build
          Frameworks/ios_system/xcfs/.build
        key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift') }}

    - name: get frameworks
      if: steps.cache.outputs.cache-hit != 'true'
      run: ./get_frameworks.sh

    - name: get resources
      if: steps.cache.outputs.cache-hit != 'true'
      run: ./get_resources.sh

    - name: copy xcconfig
      run: cp template_setup.xcconfig developer_setup.xcconfig

    - name: build unsigned app
      run: |
        set -o pipefail
        xcodebuild \
          -project Blink.xcodeproj \
          -scheme Blink \
          -sdk iphoneos \
          -configuration Debug \
          -derivedDataPath ./DerivedData \
          CODE_SIGN_IDENTITY='' \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO \
          build 2>&1 | tee build.log

    - name: strip unsupported entitlements
      run: |
        APP_PATH=$(find ./DerivedData -name "Blink.app" -type d | head -1)
        echo "Stripping unsupported entitlements for: $APP_PATH"
        # Find all executables in the app bundle
        find "$APP_PATH" -type f -perm +111 | while read EXEC; do
          # Check if it's a Mach-O binary with entitlements
          codesign -d --entitlements /tmp/ents.plist "$EXEC" 2>/dev/null || continue
          echo "Processing: $EXEC"
          # Keep only entitlements that xtool can provision.
          # xtool supports: application-identifier, team-identifier, keychain-access-groups,
          # get-task-allow, aps-environment, application-groups.
          # Everything else (iCloud, sandbox, associated domains, etc.) causes
          # provisioning profile mismatches that lead to launch crashes.
          /usr/libexec/PlistBuddy -x -c "Print" /tmp/ents.plist > /tmp/full.plist
          # Keep only supported keys by deleting everything, then re-add what we want
          for key in $(/usr/libexec/PlistBuddy -c "Print" /tmp/full.plist 2>/dev/null | grep '^    ' | sed 's/ =.*//' | tr -d ' '); do
            case "$key" in
              application-identifier|com.apple.developer.team-identifier|keychain-access-groups|get-task-allow|aps-environment|com.apple.security.application-groups) ;;
              *) /usr/libexec/PlistBuddy -c "Delete :$key" /tmp/ents.plist 2>/dev/null || true ;;
            esac
          done
          codesign -f -s - --entitlements /tmp/ents.plist "$EXEC"
        done
        rm -f /tmp/ents.plist /tmp/full.plist
        echo "Entitlement stripping complete"

    - name: generate unsigned ipa
      run: |
        APP_PATH=$(find ./DerivedData -name "Blink.app" -type d | head -1)
        echo "Found app at: $APP_PATH"
        mkdir Payload
        cp -r "$APP_PATH" Payload/
        zip -r Blink.ipa Payload

    - name: upload ipa
      uses: actions/upload-artifact@v4
      with:
        name: Blink.ipa
        path: Blink.ipa